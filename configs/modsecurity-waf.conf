# Configuracion de ModSecurity WAF en servidores web DMZ
# Ubicacion: /etc/modsecurity/modsecurity.conf

# 1. Habilitar el motor de reglas en modo bloqueo activo
SecRuleEngine On

# 2. Configuracion de analisis del cuerpo de peticiones HTTP
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072

# 3. Configuracion de registro de eventos (Audit Engine)
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /var/log/apache2/modsec_audit.log

# 4. Ingestion de reglas base OWASP Core Rule Set (CRS)
IncludeOptional /etc/modsecurity/crs/*.conf
IncludeOptional /etc/modsecurity/crs/rules/*.conf
